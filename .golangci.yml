version: "2"

run:
  timeout: 5m

# Every linter golangci-lint ships is on. The only one disabled is wsl, which
# is deprecated and replaced by wsl_v5 (enabled). Linters that need project
# knowledge (depguard, tagliatelle, exhaustruct, …) are configured below rather
# than switched off. A justified exception is a //nolint:<linter> // <reason>
# at the site, which nolintlint keeps honest.
linters:
  default: all
  disable:
    # Deprecated upstream; each is replaced by a newer major version that
    # `default: all` already enables (wsl_v5, exhaustruct_v5, gomodguard_v2).
    - wsl
    - exhaustruct
    - gomodguard
  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/stubbedev/laravel-dev-mcp
            - github.com/VKCOM/php-parser
            - github.com/go-sql-driver/mysql
            - github.com/google/jsonschema-go
            - github.com/jackc/pgx/v5
            - github.com/modelcontextprotocol/go-sdk
            - github.com/toon-format/toon-go
            - modernc.org/sqlite
    errcheck:
      check-type-assertions: true
      check-blank: false
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: false
    govet:
      enable-all: true
      disable:
        # Field order is chosen for readability and JSON output order, not
        # padding; fieldalignment would reorder every struct.
        - fieldalignment
    ireturn:
      # Defaults, plus generic: a type-parameter return is a concrete type at
      # every call site, not an interface.
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    perfsprint:
      strconcat: true
      sprintf1: true
    revive:
      enable-all-rules: true
      rules:
        # Each of these duplicates a dedicated linter enabled above; keeping
        # both reports every finding twice with different thresholds.
        - name: line-length-limit # lll
          disabled: true
        - name: cognitive-complexity # gocognit
          disabled: true
        - name: cyclomatic # cyclop
          disabled: true
        - name: function-length # funlen
          disabled: true
        - name: add-constant # mnd, goconst
          disabled: true
        - name: unhandled-error # errcheck
          disabled: true
    tagliatelle:
      case:
        rules:
          # Tool output is snake_case throughout.
          json: snake
    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
  exclusions:
    generated: lax
    rules:
      # SEP-2577 deprecates MCP roots as of protocol 2026-07-28, but they stay
      # functional for at least twelve months and are still how current
      # clients hand this server its workspace. Scoped to that SEP's URL so
      # every other deprecation still fails the gate. Delete once the window
      # closes.
      - linters:
          - staticcheck
        text: "SA1019.*seps/2577-deprecate-roots-sampling-and-logging"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gofumpt:
      extra:
        group-params: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/stubbedev/laravel-dev-mcp)
    golines:
      max-len: 120
  exclusions:
    generated: lax
